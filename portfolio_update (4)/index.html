<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Portofolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-decor" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow-drift"><div class="bg-glow" id="bg-glow"></div></div>
    <div class="bg-glow-drift alt"><div class="bg-glow dirt" id="bg-glow-2"></div></div>
    <div class="bg-block g" data-depth="18" style="width:24px;height:24px; top:10%; left:78%;"></div>
    <div class="bg-block d" data-depth="10" style="width:18px;height:18px; top:58%; left:88%; animation-delay:1.5s;"></div>
    <div class="bg-block" data-depth="14" style="width:16px;height:16px; top:30%; left:6%; animation-delay:.8s;"></div>
    <div class="bg-block g" data-depth="8" style="width:20px;height:20px; top:76%; left:18%; animation-delay:2.4s;"></div>
    <div class="bg-block d" data-depth="20" style="width:14px;height:14px; top:18%; left:45%; animation-delay:3.1s;"></div>
    <div class="bg-block s" data-depth="12" style="width:16px;height:16px; top:46%; left:92%; animation-delay:1.1s;"></div>
    <div class="bg-block s sparkle" data-depth="24" style="width:14px;height:14px; top:66%; left:38%; animation-delay:.4s;"></div>
    <div class="bg-block g" data-depth="16" style="width:12px;height:12px; top:8%; left:22%; animation-delay:2s;"></div>
    <div class="bg-block d" data-depth="9" style="width:20px;height:20px; top:88%; left:65%; animation-delay:1.8s;"></div>
    <div class="bg-skyline"></div>
  </div>

  <div class="particle-layer" id="particle-layer"></div>

  <div class="wipe" id="wipe"><span class="wipe-spinner"></span></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <div class="topbar">
        <span class="topbar-title">// halaman utama</span>
      </div>

      <div class="content">
        <section class="proj-header">
          <div class="proj-icon" id="home-frame">
            <img id="home-photo" alt="Foto profil">
            <span class="icon-corner tl"></span>
            <span class="icon-corner tr"></span>
            <span class="icon-corner bl"></span>
            <span class="icon-corner br"></span>
          </div>
          <div class="proj-info">
            <h1 class="proj-title" id="home-title">—</h1>
            <div class="proj-role" id="home-role"></div>
            <p class="proj-desc" id="home-desc"></p>

            <div class="stat-row">
              <div class="stat"><span class="stat-num" id="stat-poster">0</span><span class="stat-label">Poster</span></div>
              <div class="stat"><span class="stat-num" id="stat-photo">0</span><span class="stat-label">Foto</span></div>
              <div class="stat"><span class="stat-num" id="stat-video">0</span><span class="stat-label">Video</span></div>
            </div>

            <div class="meta-row" id="meta-row"></div>
            <div class="action-row" id="action-row"></div>
          </div>
        </section>

        <div class="section-h">
          <h2>Tools yang dipakai</h2>
          <span class="section-sub">software / aplikasi</span>
        </div>
        <div class="chip-grid" id="chip-grid"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
